<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#60739f"/></marker>
    <marker id="ng" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d23f3f"/></marker>
  </defs>
  <rect width="800" height="300" fill="#fff"/>
  <line x1="400" y1="20" x2="400" y2="280" stroke="#e5e9f0" stroke-width="2"/>

  <!-- A -->
  <text x="200" y="32" text-anchor="middle" font-size="16" font-weight="700" fill="#222939">A. 트랜잭션 안에서 발행</text>
  <rect x="140" y="55" width="120" height="44" rx="8" fill="#f4f6fa" stroke="#222939"/>
  <text x="200" y="82" text-anchor="middle" font-size="14" fill="#222939">애플리케이션</text>
  <rect x="40" y="180" width="120" height="44" rx="8" fill="#f4f6fa" stroke="#222939"/>
  <text x="100" y="207" text-anchor="middle" font-size="14" fill="#222939">DB</text>
  <rect x="240" y="180" width="120" height="44" rx="8" fill="#f4f6fa" stroke="#222939"/>
  <text x="300" y="207" text-anchor="middle" font-size="14" fill="#222939">메시지 큐</text>
  <line x1="230" y1="99" x2="288" y2="178" stroke="#60739f" stroke-width="2" marker-end="url(#ok)"/>
  <text x="272" y="135" font-size="13" fill="#1f8a4c">① 발행 ✓</text>
  <line x1="170" y1="99" x2="112" y2="178" stroke="#d23f3f" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ng)"/>
  <text x="128" y="135" text-anchor="end" font-size="13" fill="#d23f3f">② 커밋 실패 ✗</text>
  <text x="200" y="262" text-anchor="middle" font-size="14" font-weight="700" fill="#d23f3f">롤백된 데이터에 대한 메시지가 나감</text>

  <!-- B -->
  <text x="600" y="32" text-anchor="middle" font-size="16" font-weight="700" fill="#222939">B. 커밋 뒤에 발행</text>
  <rect x="540" y="55" width="120" height="44" rx="8" fill="#f4f6fa" stroke="#222939"/>
  <text x="600" y="82" text-anchor="middle" font-size="14" fill="#222939">애플리케이션</text>
  <rect x="440" y="180" width="120" height="44" rx="8" fill="#f4f6fa" stroke="#222939"/>
  <text x="500" y="207" text-anchor="middle" font-size="14" fill="#222939">DB</text>
  <rect x="640" y="180" width="120" height="44" rx="8" fill="#f4f6fa" stroke="#222939"/>
  <text x="700" y="207" text-anchor="middle" font-size="14" fill="#222939">메시지 큐</text>
  <line x1="570" y1="99" x2="512" y2="178" stroke="#60739f" stroke-width="2" marker-end="url(#ok)"/>
  <text x="528" y="135" text-anchor="end" font-size="13" fill="#1f8a4c">① 커밋 ✓</text>
  <line x1="630" y1="99" x2="688" y2="178" stroke="#d23f3f" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ng)"/>
  <text x="672" y="128" font-size="13" fill="#d23f3f">② 발행 전</text>
  <text x="672" y="146" font-size="13" fill="#d23f3f">서버 다운 ✗</text>
  <text x="600" y="262" text-anchor="middle" font-size="14" font-weight="700" fill="#d23f3f">데이터는 있는데 메시지가 유실됨</text>
</svg>
