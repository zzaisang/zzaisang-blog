<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#60739f"/></marker>
  </defs>
  <rect width="800" height="330" fill="#fff"/>

  <!-- lanes -->
  <rect x="70" y="20" width="160" height="40" rx="8" fill="#f4f6fa" stroke="#222939"/>
  <text x="150" y="45" text-anchor="middle" font-size="14" fill="#222939">컨슈머 A</text>
  <rect x="320" y="20" width="160" height="40" rx="8" fill="#f5f7ff" stroke="#2337ff" stroke-width="2"/>
  <text x="400" y="45" text-anchor="middle" font-size="14" font-weight="700" fill="#2337ff">아웃박스 행 #42</text>
  <rect x="570" y="20" width="160" height="40" rx="8" fill="#f4f6fa" stroke="#222939"/>
  <text x="650" y="45" text-anchor="middle" font-size="14" fill="#222939">컨슈머 B</text>
  <line x1="150" y1="60" x2="150" y2="300" stroke="#c9d1e0" stroke-dasharray="4 4"/>
  <line x1="400" y1="60" x2="400" y2="300" stroke="#c9d1e0" stroke-dasharray="4 4"/>
  <line x1="650" y1="60" x2="650" y2="300" stroke="#c9d1e0" stroke-dasharray="4 4"/>

  <rect x="335" y="72" width="130" height="26" rx="13" fill="#fff" stroke="#60739f"/>
  <text x="400" y="90" text-anchor="middle" font-size="12" fill="#222939">PENDING</text>

  <!-- both send conditional update -->
  <line x1="150" y1="125" x2="398" y2="125" stroke="#60739f" stroke-width="2" marker-end="url(#a)"/>
  <text x="275" y="117" text-anchor="middle" font-size="11" font-family="ui-monospace,Menlo,monospace" fill="#222939">UPDATE … WHERE status='PENDING'</text>
  <line x1="650" y1="150" x2="402" y2="150" stroke="#60739f" stroke-width="2" marker-end="url(#a)"/>
  <text x="525" y="142" text-anchor="middle" font-size="11" font-family="ui-monospace,Menlo,monospace" fill="#222939">UPDATE … WHERE status='PENDING'</text>

  <!-- A wins -->
  <line x1="400" y1="185" x2="152" y2="185" stroke="#1f8a4c" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a)"/>
  <text x="275" y="177" text-anchor="middle" font-size="12" fill="#1f8a4c">1 row 갱신 ✓</text>
  <rect x="335" y="200" width="130" height="26" rx="13" fill="#eaf6ef" stroke="#1f8a4c"/>
  <text x="400" y="218" text-anchor="middle" font-size="12" font-weight="700" fill="#1f8a4c">SENT</text>

  <!-- B loses -->
  <line x1="400" y1="250" x2="648" y2="250" stroke="#60739f" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a)"/>
  <text x="525" y="242" text-anchor="middle" font-size="12" fill="#60739f">0 row 갱신 (이미 SENT)</text>

  <text x="150" y="290" text-anchor="middle" font-size="13" font-weight="700" fill="#1f8a4c">처리 기록 1회</text>
  <text x="650" y="290" text-anchor="middle" font-size="13" font-weight="700" fill="#60739f">중복으로 보고 ACK</text>
</svg>
