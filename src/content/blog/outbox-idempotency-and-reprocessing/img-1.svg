<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 390" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#60739f"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d23f3f"/></marker>
  </defs>
  <rect width="800" height="390" fill="#fff"/>

  <!-- lanes -->
  <rect x="70" y="20" width="160" height="40" rx="8" fill="#f4f6fa" stroke="#222939"/>
  <text x="150" y="45" text-anchor="middle" font-size="14" fill="#222939">컨슈머</text>
  <rect x="320" y="20" width="160" height="40" rx="8" fill="#f5f7ff" stroke="#2337ff" stroke-width="2"/>
  <text x="400" y="45" text-anchor="middle" font-size="14" font-weight="700" fill="#2337ff">아웃박스 행 #42</text>
  <rect x="570" y="20" width="160" height="40" rx="8" fill="#f4f6fa" stroke="#222939"/>
  <text x="650" y="45" text-anchor="middle" font-size="14" fill="#222939">외부 API</text>
  <line x1="150" y1="60" x2="150" y2="370" stroke="#c9d1e0" stroke-dasharray="4 4"/>
  <line x1="400" y1="60" x2="400" y2="370" stroke="#c9d1e0" stroke-dasharray="4 4"/>
  <line x1="650" y1="60" x2="650" y2="370" stroke="#c9d1e0" stroke-dasharray="4 4"/>

  <!-- first delivery -->
  <line x1="150" y1="95" x2="398" y2="95" stroke="#60739f" stroke-width="2" marker-end="url(#a)"/>
  <text x="275" y="87" text-anchor="middle" font-size="12" fill="#222939">① 상태 확인 → PENDING</text>
  <line x1="150" y1="130" x2="648" y2="130" stroke="#60739f" stroke-width="2" marker-end="url(#a)"/>
  <text x="525" y="122" text-anchor="middle" font-size="12" fill="#222939">② 발송 요청</text>
  <line x1="650" y1="160" x2="152" y2="160" stroke="#1f8a4c" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a)"/>
  <text x="525" y="152" text-anchor="middle" font-size="12" fill="#1f8a4c">200 OK (발송됨)</text>
  <rect x="690" y="140" width="80" height="24" rx="12" fill="#eaf6ef" stroke="#1f8a4c"/>
  <text x="730" y="157" text-anchor="middle" font-size="12" font-weight="700" fill="#1f8a4c">발송 1회</text>

  <!-- crash -->
  <text x="150" y="198" text-anchor="middle" font-size="13" font-weight="700" fill="#d23f3f">✗ ③ 서버 다운</text>
  <text x="150" y="215" text-anchor="middle" font-size="12" fill="#d23f3f">(SENT 갱신 전)</text>
  <line x1="40" y1="240" x2="760" y2="240" stroke="#c9d1e0" stroke-width="1.5" stroke-dasharray="8 5"/>
  <rect x="300" y="229" width="200" height="22" rx="11" fill="#fff" stroke="#c9d1e0"/>
  <text x="400" y="245" text-anchor="middle" font-size="12" fill="#60739f">가시성 타임아웃 후 재전달</text>

  <!-- redelivery -->
  <line x1="150" y1="280" x2="398" y2="280" stroke="#d23f3f" stroke-width="2" marker-end="url(#r)"/>
  <text x="275" y="272" text-anchor="middle" font-size="12" fill="#d23f3f">④ 다시 받음 → 여전히 PENDING</text>
  <line x1="150" y1="320" x2="648" y2="320" stroke="#d23f3f" stroke-width="2" marker-end="url(#r)"/>
  <text x="525" y="312" text-anchor="middle" font-size="12" fill="#d23f3f">⑤ 발송 요청</text>
  <rect x="690" y="330" width="80" height="24" rx="12" fill="#fdecec" stroke="#d23f3f"/>
  <text x="730" y="347" text-anchor="middle" font-size="12" font-weight="700" fill="#d23f3f">발송 2회</text>
</svg>
