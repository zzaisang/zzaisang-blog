<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#60739f"/></marker>
  </defs>
  <style>
    /* 단계 ①→⑤가 10초 타임라인 위에서 차례로 나타나고, 잠시 머문 뒤 반복 */
    .s1, .s2, .s3, .s4, .s5 { animation: 10s ease-out infinite; }
    .s1 { animation-name: s1; } .s2 { animation-name: s2; } .s3 { animation-name: s3; } .s4 { animation-name: s4; } .s5 { animation-name: s5; }
    @keyframes s1 { 0% { opacity: 0; } 4% { opacity: 1; } 88% { opacity: 1; } 95%, 100% { opacity: 0; } }
    @keyframes s2 { 0%, 15% { opacity: 0; } 19% { opacity: 1; } 88% { opacity: 1; } 95%, 100% { opacity: 0; } }
    @keyframes s3 { 0%, 30% { opacity: 0; } 34% { opacity: 1; } 88% { opacity: 1; } 95%, 100% { opacity: 0; } }
    @keyframes s4 { 0%, 45% { opacity: 0; } 49% { opacity: 1; } 88% { opacity: 1; } 95%, 100% { opacity: 0; } }
    @keyframes s5 { 0%, 60% { opacity: 0; } 64% { opacity: 1; } 88% { opacity: 1; } 95%, 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .s1, .s2, .s3, .s4, .s5 { animation: none; } }
  </style>
  <rect width="800" height="220" fill="#fff"/>

  <rect x="31" y="50" width="130" height="70" rx="10" fill="#f4f6fa" stroke="#222939" class="s1"/>
  <text x="96" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="#222939" class="s1">① 문제 감지</text>
  <text x="96" y="100" text-anchor="middle" font-size="12" fill="#60739f" class="s1">성능 알림</text>

  <rect x="183" y="50" width="130" height="70" rx="10" fill="#f4f6fa" stroke="#222939" class="s2"/>
  <text x="248" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="#222939" class="s2">② 에이전트</text>
  <text x="248" y="100" text-anchor="middle" font-size="12" fill="#60739f" class="s2">원인 조사 · 수정안</text>

  <rect x="335" y="44" width="130" height="82" rx="10" fill="#eef1ff" stroke="#2337ff" stroke-width="2.5" class="s3"/>
  <text x="400" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="#2337ff" class="s3">③ 엔지니어</text>
  <text x="400" y="100" text-anchor="middle" font-size="12" fill="#2337ff" class="s3">리뷰 · 승인</text>

  <rect x="487" y="50" width="130" height="70" rx="10" fill="#f4f6fa" stroke="#222939" class="s4"/>
  <text x="552" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="#222939" class="s4">④ 배포</text>
  <text x="552" y="100" text-anchor="middle" font-size="12" fill="#60739f" class="s4">승인된 수정안만</text>

  <rect x="639" y="50" width="130" height="70" rx="10" fill="#f4f6fa" stroke="#222939" class="s5"/>
  <text x="704" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="#222939" class="s5">⑤ 다른 에이전트</text>
  <text x="704" y="100" text-anchor="middle" font-size="12" fill="#60739f" class="s5">실제로 고쳐졌나 확인</text>

  <line x1="161" y1="85" x2="181" y2="85" stroke="#60739f" stroke-width="2" marker-end="url(#a)" class="s2"/>
  <line x1="313" y1="85" x2="333" y2="85" stroke="#60739f" stroke-width="2" marker-end="url(#a)" class="s3"/>
  <line x1="465" y1="85" x2="485" y2="85" stroke="#60739f" stroke-width="2" marker-end="url(#a)" class="s4"/>
  <line x1="617" y1="85" x2="637" y2="85" stroke="#60739f" stroke-width="2" marker-end="url(#a)" class="s5"/>

  <rect x="230" y="165" width="16" height="16" rx="3" fill="#f4f6fa" stroke="#222939"/>
  <text x="254" y="178" font-size="12" fill="#60739f">자동 (에이전트·시스템)</text>
  <rect x="430" y="165" width="16" height="16" rx="3" fill="#eef1ff" stroke="#2337ff" stroke-width="2"/>
  <text x="454" y="178" font-size="12" fill="#2337ff">사람이 확인하는 지점</text>
</svg>
