<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif">
  <style>
    /* 같은 10초 타임라인 위에서 단계 ①~⑤가 차례로 나타나고, 잠시 머문 뒤 처음부터 반복 */
    .s1, .s2, .s3, .s4, .s5 { animation: 10s ease-out infinite; }
    .s1 { animation-name: s1; } .s2 { animation-name: s2; } .s3 { animation-name: s3; }
    .s4 { animation-name: s4; } .s5 { animation-name: s5; }
    @keyframes s1 { 0% { opacity: 0; }       4% { opacity: 1; } 88% { opacity: 1; } 95%, 100% { opacity: 0; } }
    @keyframes s2 { 0%, 15% { opacity: 0; } 19% { opacity: 1; } 88% { opacity: 1; } 95%, 100% { opacity: 0; } }
    @keyframes s3 { 0%, 30% { opacity: 0; } 34% { opacity: 1; } 88% { opacity: 1; } 95%, 100% { opacity: 0; } }
    @keyframes s4 { 0%, 45% { opacity: 0; } 49% { opacity: 1; } 88% { opacity: 1; } 95%, 100% { opacity: 0; } }
    @keyframes s5 { 0%, 60% { opacity: 0; } 64% { opacity: 1; } 88% { opacity: 1; } 95%, 100% { opacity: 0; } }
    /* 서버 B 대기 막대: ②에서 자라기 시작해 ④(A 커밋과 동시에 락 획득) 직전까지 늘어난다 */
    .wait { stroke-dasharray: 71; animation: wait 10s linear infinite; }
    @keyframes wait {
      0%, 15% { stroke-dashoffset: 71; opacity: 1; }
      45%     { stroke-dashoffset: 0; }
      88%     { stroke-dashoffset: 0; opacity: 1; }
      95%     { stroke-dashoffset: 0; opacity: 0; }
      100%    { stroke-dashoffset: 71; opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .s1, .s2, .s3, .s4, .s5, .wait { animation: none; }
      .wait { stroke-dasharray: none; }
    }
  </style>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2337ff"/>
    </marker>
  </defs>
  <rect width="800" height="360" fill="#fff"/>

  <text x="400" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#222939">같은 키 (WELCOME_COUPON, 고객 42)로 pg_advisory_xact_lock</text>

  <g font-size="12" fill="#60739f" text-anchor="middle">
    <text x="60" y="101" class="s1">①</text>
    <text x="60" y="146" class="s2">②</text>
    <text x="60" y="201" class="s3">③</text>
    <text x="60" y="251" class="s4">④</text>
    <text x="60" y="301" class="s5">⑤</text>
  </g>

  <text x="250" y="62" text-anchor="middle" font-size="14" font-weight="700" fill="#222939">서버 A · 주문 1</text>
  <text x="550" y="62" text-anchor="middle" font-size="14" font-weight="700" fill="#222939">서버 B · 주문 2</text>
  <line x1="250" y1="70" x2="250" y2="340" stroke="#c9d1e0" stroke-dasharray="4 4"/>
  <line x1="550" y1="70" x2="550" y2="340" stroke="#c9d1e0" stroke-dasharray="4 4"/>

  <g class="s1">
    <rect x="120" y="80" width="260" height="32" rx="6" fill="#f5f7ff" stroke="#2337ff"/>
    <text x="250" y="101" text-anchor="middle" font-size="12" fill="#2337ff">락 획득</text>
  </g>
  <g class="s2">
    <rect x="420" y="125" width="260" height="32" rx="6" fill="#fff8ec" stroke="#c77700"/>
    <text x="550" y="146" text-anchor="middle" font-size="12" fill="#8a5300">같은 키 요청 · 대기</text>
  </g>
  <line x1="550" y1="157" x2="550" y2="228" stroke="#c77700" stroke-width="4" class="wait"/>
  <g class="s3">
    <rect x="120" y="180" width="260" height="32" rx="6" fill="#eaf6ef" stroke="#1f8a4c"/>
    <text x="250" y="201" text-anchor="middle" font-size="12" fill="#1f8a4c">count = 0 · 쿠폰 발급 · COMMIT</text>
  </g>
  <g class="s4">
    <path d="M380,212 L420,240" fill="none" stroke="#2337ff" stroke-width="2" marker-end="url(#arrow-blue)"/>
    <text x="388" y="240" text-anchor="end" font-size="11" fill="#2337ff">커밋 = 해제</text>
    <rect x="420" y="230" width="260" height="32" rx="6" fill="#f5f7ff" stroke="#2337ff" stroke-width="2"/>
    <text x="550" y="251" text-anchor="middle" font-size="12" fill="#2337ff">A 커밋과 동시에 락 획득</text>
  </g>
  <g class="s5">
    <rect x="420" y="280" width="260" height="32" rx="6" fill="#f4f6fa" stroke="#222939"/>
    <text x="550" y="301" text-anchor="middle" font-size="12" fill="#222939">count = 1 · 쿠폰 건너뜀 · COMMIT</text>
  </g>
</svg>
