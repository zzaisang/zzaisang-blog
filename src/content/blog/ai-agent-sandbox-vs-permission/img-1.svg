<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif">
  <rect width="800" height="420" fill="#fff"/>
  <style>
    .flow  { stroke-dasharray: 5 4; animation: flow 0.8s linear infinite; }
    .focus { animation: pulse 1.8s ease-in-out infinite; }
    @keyframes flow  { to { stroke-dashoffset: -9; } }
    @keyframes pulse { 50% { stroke-width: 5; } }
    @media (prefers-reduced-motion: reduce) { .flow, .focus { animation: none; } }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#60739f"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f8a4c"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d23f3f"/></marker>
  </defs>

  <!-- 명령 -->
  <rect x="20" y="180" width="110" height="56" rx="8" fill="#f4f6fa" stroke="#222939" stroke-width="1.5"/>
  <text x="75" y="213" text-anchor="middle" font-size="15" font-weight="700" fill="#222939">Bash 명령</text>
  <line x1="130" y1="208" x2="166" y2="208" stroke="#60739f" stroke-width="2" marker-end="url(#a)"/>

  <!-- ① 권한 확인 -->
  <rect x="170" y="70" width="160" height="276" rx="10" fill="#f5f7ff" stroke="#2337ff" stroke-width="2"/>
  <text x="250" y="104" text-anchor="middle" font-size="16" font-weight="700" fill="#2337ff">① 권한 확인</text>
  <text x="250" y="130" text-anchor="middle" font-size="13" fill="#222939">실행해도 되나?</text>
  <line x1="190" y1="148" x2="310" y2="148" stroke="#e5e9f0"/>
  <text x="250" y="178" text-anchor="middle" font-size="13" fill="#222939">사람이 의도를 보고</text>
  <text x="250" y="198" text-anchor="middle" font-size="13" fill="#222939">승인하거나 거절</text>
  <text x="250" y="300" text-anchor="middle" font-size="12" fill="#8a5300">자동 승인을 켜면</text>
  <text x="250" y="318" text-anchor="middle" font-size="12" fill="#8a5300">이 층을 건너뛴다</text>
  <line x1="330" y1="208" x2="356" y2="208" stroke="#60739f" stroke-width="2" marker-end="url(#a)"/>

  <!-- ② 샌드박스 -->
  <rect x="360" y="30" width="420" height="370" rx="10" fill="#f4f6fa" stroke="#60739f" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="380" y="60" font-size="16" font-weight="700" fill="#222939">② 샌드박스</text>
  <text x="474" y="60" font-size="13" fill="#60739f">실행되면 어디까지 닿나?</text>

  <!-- 파일 쓰기 -->
  <rect x="380" y="88" width="100" height="44" rx="6" fill="#fff" stroke="#222939"/>
  <text x="430" y="115" text-anchor="middle" font-size="14" fill="#222939">파일 쓰기</text>
  <line x1="480" y1="110" x2="596" y2="110" stroke="#1f8a4c" stroke-width="2" marker-end="url(#g)"/>
  <rect x="600" y="88" width="165" height="44" rx="6" fill="#eaf6ef" stroke="#1f8a4c"/>
  <text x="682" y="115" text-anchor="middle" font-size="13" fill="#1f8a4c">작업·임시·추가 폴더 ✓</text>
  <text x="600" y="154" font-size="12" fill="#d23f3f">그 밖의 경로에 쓰기 ✕</text>

  <line x1="380" y1="176" x2="765" y2="176" stroke="#e5e9f0"/>

  <!-- 네트워크 -->
  <rect x="380" y="226" width="100" height="44" rx="6" fill="#fff" stroke="#222939"/>
  <text x="430" y="253" text-anchor="middle" font-size="14" fill="#222939">네트워크</text>
  <line x1="480" y1="248" x2="506" y2="248" stroke="#60739f" stroke-width="2" marker-end="url(#a)"/>
  <rect x="510" y="226" width="80" height="44" rx="6" fill="#fff" stroke="#60739f"/>
  <text x="550" y="253" text-anchor="middle" font-size="14" fill="#222939">프록시</text>
  <line x1="590" y1="240" x2="636" y2="213" stroke="#1f8a4c" stroke-width="2" marker-end="url(#g)"/>
  <rect x="640" y="192" width="125" height="40" rx="6" fill="#eaf6ef" stroke="#1f8a4c"/>
  <text x="702" y="217" text-anchor="middle" font-size="13" fill="#1f8a4c">허용 도메인 ✓</text>
  <line class="flow" x1="590" y1="258" x2="636" y2="282" stroke="#d23f3f" stroke-width="2" marker-end="url(#r)"/>
  <rect class="focus" x="640" y="264" width="125" height="40" rx="6" fill="#fdecec" stroke="#d23f3f" stroke-width="2"/>
  <text x="702" y="289" text-anchor="middle" font-size="13" fill="#d23f3f">허용 안 된 도메인 ✕</text>
  <text x="702" y="322" text-anchor="middle" font-size="12" fill="#d23f3f">프록시에서 멈춘다</text>

  <!-- 읽기 -->
  <rect x="380" y="344" width="385" height="40" rx="6" fill="#fff8ec" stroke="#c77700"/>
  <text x="572" y="369" text-anchor="middle" font-size="13" fill="#8a5300">읽기는 대부분 열려 있다 (~/.ssh, ~/.aws/credentials 포함)</text>
</svg>
