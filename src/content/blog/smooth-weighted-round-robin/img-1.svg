<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif">
  <style>
    /* 회차 1~7이 차례로 나타난다. 빨간 점선 = 뽑힌 서버에서 total(7)만큼 깎이는 구간 */
    .s1, .s2, .s3, .s4, .s5, .s6, .s7 { animation: 10s ease-out infinite; }
    .s1 { animation-name: s1; }
    @keyframes s1 { 0% { opacity: 0; } 4% { opacity: 1; } 88% { opacity: 1; } 95%, 100% { opacity: 0; } }
    .s2 { animation-name: s2; }
    @keyframes s2 { 0%, 10% { opacity: 0; } 14% { opacity: 1; } 88% { opacity: 1; } 95%, 100% { opacity: 0; } }
    .s3 { animation-name: s3; }
    @keyframes s3 { 0%, 20% { opacity: 0; } 24% { opacity: 1; } 88% { opacity: 1; } 95%, 100% { opacity: 0; } }
    .s4 { animation-name: s4; }
    @keyframes s4 { 0%, 30% { opacity: 0; } 34% { opacity: 1; } 88% { opacity: 1; } 95%, 100% { opacity: 0; } }
    .s5 { animation-name: s5; }
    @keyframes s5 { 0%, 40% { opacity: 0; } 44% { opacity: 1; } 88% { opacity: 1; } 95%, 100% { opacity: 0; } }
    .s6 { animation-name: s6; }
    @keyframes s6 { 0%, 50% { opacity: 0; } 54% { opacity: 1; } 88% { opacity: 1; } 95%, 100% { opacity: 0; } }
    .s7 { animation-name: s7; }
    @keyframes s7 { 0%, 60% { opacity: 0; } 64% { opacity: 1; } 88% { opacity: 1; } 95%, 100% { opacity: 0; } }
    .cut { animation: blink 1.2s ease-in-out infinite; }
    @keyframes blink { 50% { fill-opacity: 0.15; } }
    @media (prefers-reduced-motion: reduce) { .s1, .s2, .s3, .s4, .s5, .s6, .s7, .cut { animation: none; } }
  </style>
