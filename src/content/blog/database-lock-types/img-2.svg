<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 290" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f8a4c"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c77700"/></marker>
  </defs>
  <rect width="800" height="290" fill="#fff"/>
  <line x1="400" y1="20" x2="400" y2="250" stroke="#e5e9f0" stroke-width="2"/>

  <!-- left: S held -->
  <text x="200" y="32" text-anchor="middle" font-size="16" font-weight="700" fill="#222939">공유 락(S)이 걸린 행</text>
  <rect x="120" y="60" width="160" height="60" rx="10" fill="#f5f7ff" stroke="#2337ff" stroke-width="2"/>
  <text x="200" y="85" text-anchor="middle" font-size="14" font-weight="700" fill="#2337ff">stock id = 1</text>
  <text x="200" y="106" text-anchor="middle" font-size="12" fill="#2337ff">T1: S 락 보유</text>
  <rect x="30" y="200" width="120" height="40" rx="8" fill="#f4f6fa" stroke="#222939"/>
  <text x="90" y="225" text-anchor="middle" font-size="13" fill="#222939">T2: S 요청</text>
  <rect x="250" y="200" width="120" height="40" rx="8" fill="#f4f6fa" stroke="#222939"/>
  <text x="310" y="225" text-anchor="middle" font-size="13" fill="#222939">T3: X 요청</text>
  <line x1="90" y1="200" x2="160" y2="123" stroke="#1f8a4c" stroke-width="2" marker-end="url(#g)"/>
  <text x="105" y="160" text-anchor="end" font-size="13" font-weight="700" fill="#1f8a4c">✓ 허용</text>
  <line x1="310" y1="200" x2="240" y2="123" stroke="#c77700" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#o)"/>
  <text x="295" y="160" font-size="13" font-weight="700" fill="#8a5300">대기</text>

  <!-- right: X held -->
  <text x="600" y="32" text-anchor="middle" font-size="16" font-weight="700" fill="#222939">배타 락(X)이 걸린 행</text>
  <rect x="520" y="60" width="160" height="60" rx="10" fill="#fdecec" stroke="#d23f3f" stroke-width="2"/>
  <text x="600" y="85" text-anchor="middle" font-size="14" font-weight="700" fill="#d23f3f">stock id = 1</text>
  <text x="600" y="106" text-anchor="middle" font-size="12" fill="#d23f3f">T1: X 락 보유</text>
  <rect x="430" y="200" width="120" height="40" rx="8" fill="#f4f6fa" stroke="#222939"/>
  <text x="490" y="225" text-anchor="middle" font-size="13" fill="#222939">T2: S 요청</text>
  <rect x="650" y="200" width="120" height="40" rx="8" fill="#f4f6fa" stroke="#222939"/>
  <text x="710" y="225" text-anchor="middle" font-size="13" fill="#222939">T3: X 요청</text>
  <line x1="490" y1="200" x2="560" y2="123" stroke="#c77700" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#o)"/>
  <text x="505" y="160" text-anchor="end" font-size="13" font-weight="700" fill="#8a5300">대기</text>
  <line x1="710" y1="200" x2="640" y2="123" stroke="#c77700" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#o)"/>
  <text x="695" y="160" font-size="13" font-weight="700" fill="#8a5300">대기</text>

  <text x="400" y="278" text-anchor="middle" font-size="12" fill="#60739f">※ 일반 SELECT는 락 없이 스냅샷(MVCC)으로 읽으므로 두 경우 모두 막히지 않는다</text>
</svg>
