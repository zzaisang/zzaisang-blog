<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 370" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif">
  <style>
    /* 같은 10초 타임라인 위에서 단계 ①~⑤가 차례로 나타나고, 잠시 머문 뒤 처음부터 반복 */
    .s1, .s2, .s3, .s4, .s5 { animation: 10s ease-out infinite; }
    .s1 { animation-name: s1; } .s2 { animation-name: s2; } .s3 { animation-name: s3; }
    .s4 { animation-name: s4; } .s5 { animation-name: s5; }
    @keyframes s1 { 0% { opacity: 0; }       4% { opacity: 1; } 88% { opacity: 1; } 95%, 100% { opacity: 0; } }
    @keyframes s2 { 0%, 15% { opacity: 0; } 19% { opacity: 1; } 88% { opacity: 1; } 95%, 100% { opacity: 0; } }
    @keyframes s3 { 0%, 30% { opacity: 0; } 34% { opacity: 1; } 88% { opacity: 1; } 95%, 100% { opacity: 0; } }
    @keyframes s4 { 0%, 45% { opacity: 0; } 49% { opacity: 1; } 88% { opacity: 1; } 95%, 100% { opacity: 0; } }
    @keyframes s5 { 0%, 60% { opacity: 0; } 64% { opacity: 1; } 88% { opacity: 1; } 95%, 100% { opacity: 0; } }
    /* T2 대기 막대: ②에서 자라기 시작해 ④(락 획득) 직전까지 늘어난다 */
    .wait { stroke-dasharray: 71; animation: wait 10s linear infinite; }
    @keyframes wait {
      0%, 15% { stroke-dashoffset: 71; opacity: 1; }
      45%     { stroke-dashoffset: 0; }
      88%     { stroke-dashoffset: 0; opacity: 1; }
      95%     { stroke-dashoffset: 0; opacity: 0; }
      100%    { stroke-dashoffset: 71; opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .s1, .s2, .s3, .s4, .s5, .wait { animation: none; }
      .wait { stroke-dasharray: none; }
    }
  </style>
  <rect width="800" height="370" fill="#fff"/>
  <line x1="400" y1="20" x2="400" y2="350" stroke="#e5e9f0" stroke-width="2"/>

  <!-- step numbers (time axis) -->
  <g font-size="12" fill="#60739f" text-anchor="middle">
    <text x="20" y="101" class="s1">①</text>
    <text x="20" y="146" class="s2">②</text>
    <text x="20" y="201" class="s3">③</text>
    <text x="20" y="251" class="s4">④</text>
    <text x="20" y="301" class="s5">⑤</text>
  </g>

  <!-- pessimistic -->
  <text x="200" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#222939">비관적 락: 먼저 잠근다</text>
  <text x="110" y="62" text-anchor="middle" font-size="14" font-weight="700" fill="#222939">T1</text>
  <text x="290" y="62" text-anchor="middle" font-size="14" font-weight="700" fill="#222939">T2</text>
  <line x1="110" y1="70" x2="110" y2="340" stroke="#c9d1e0" stroke-dasharray="4 4"/>
  <line x1="290" y1="70" x2="290" y2="340" stroke="#c9d1e0" stroke-dasharray="4 4"/>

  <g class="s1">
    <rect x="35" y="80" width="150" height="32" rx="6" fill="#f5f7ff" stroke="#2337ff"/>
    <text x="110" y="101" text-anchor="middle" font-size="12" fill="#2337ff">FOR UPDATE · 락 획득</text>
  </g>
  <g class="s2">
    <rect x="215" y="125" width="150" height="32" rx="6" fill="#fff8ec" stroke="#c77700"/>
    <text x="290" y="146" text-anchor="middle" font-size="12" fill="#8a5300">FOR UPDATE · 대기</text>
  </g>
  <line x1="290" y1="157" x2="290" y2="228" stroke="#c77700" stroke-width="4" class="wait"/>
  <g class="s3">
    <rect x="35" y="180" width="150" height="32" rx="6" fill="#f4f6fa" stroke="#222939"/>
    <text x="110" y="201" text-anchor="middle" font-size="12" fill="#222939">재고 차감 · COMMIT</text>
  </g>
  <g class="s4">
    <rect x="215" y="230" width="150" height="32" rx="6" fill="#f5f7ff" stroke="#2337ff"/>
    <text x="290" y="251" text-anchor="middle" font-size="12" fill="#2337ff">락 획득 · 최신 값 읽음</text>
  </g>
  <g class="s5">
    <rect x="215" y="280" width="150" height="32" rx="6" fill="#f4f6fa" stroke="#222939"/>
    <text x="290" y="301" text-anchor="middle" font-size="12" fill="#222939">재고 차감 · COMMIT</text>
  </g>

  <!-- optimistic -->
  <text x="600" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#222939">낙관적 락: 나중에 확인한다</text>
  <text x="510" y="62" text-anchor="middle" font-size="14" font-weight="700" fill="#222939">T1</text>
  <text x="690" y="62" text-anchor="middle" font-size="14" font-weight="700" fill="#222939">T2</text>
  <line x1="510" y1="70" x2="510" y2="340" stroke="#c9d1e0" stroke-dasharray="4 4"/>
  <line x1="690" y1="70" x2="690" y2="340" stroke="#c9d1e0" stroke-dasharray="4 4"/>

  <g class="s1">
    <rect x="435" y="80" width="150" height="32" rx="6" fill="#f4f6fa" stroke="#222939"/>
    <text x="510" y="101" text-anchor="middle" font-size="12" fill="#222939">읽기 (version = 1)</text>
    <rect x="615" y="80" width="150" height="32" rx="6" fill="#f4f6fa" stroke="#222939"/>
    <text x="690" y="101" text-anchor="middle" font-size="12" fill="#222939">읽기 (version = 1)</text>
  </g>
  <g class="s2">
    <rect x="435" y="125" width="150" height="32" rx="6" fill="#f4f6fa" stroke="#222939"/>
    <text x="510" y="146" text-anchor="middle" font-size="12" fill="#222939">UPDATE … version = 1</text>
  </g>
  <g class="s3">
    <rect x="435" y="180" width="150" height="32" rx="6" fill="#eaf6ef" stroke="#1f8a4c"/>
    <text x="510" y="201" text-anchor="middle" font-size="12" font-weight="700" fill="#1f8a4c">1 row → version 2 ✓</text>
  </g>
  <g class="s4">
    <rect x="615" y="230" width="150" height="32" rx="6" fill="#f4f6fa" stroke="#222939"/>
    <text x="690" y="251" text-anchor="middle" font-size="12" fill="#222939">UPDATE … version = 1</text>
  </g>
  <g class="s5">
    <rect x="615" y="280" width="150" height="32" rx="6" fill="#fdecec" stroke="#d23f3f"/>
    <text x="690" y="301" text-anchor="middle" font-size="12" font-weight="700" fill="#d23f3f">0 row → 충돌 · 재시도</text>
  </g>
</svg>
