<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#60739f"/></marker>
  </defs>
  <style>
    /* 단계 ①→⑤가 10초 타임라인 위에서 차례로 나타나고, 잠시 머문 뒤 반복 */
    .s1, .s2, .s3, .s4, .s5 { animation: 10s ease-out infinite; }
    .s1 { animation-name: s1; } .s2 { animation-name: s2; } .s3 { animation-name: s3; } .s4 { animation-name: s4; } .s5 { animation-name: s5; }
    @keyframes s1 { 0% { opacity: 0; } 4% { opacity: 1; } 88% { opacity: 1; } 95%, 100% { opacity: 0; } }
    @keyframes s2 { 0%, 15% { opacity: 0; } 19% { opacity: 1; } 88% { opacity: 1; } 95%, 100% { opacity: 0; } }
    @keyframes s3 { 0%, 30% { opacity: 0; } 34% { opacity: 1; } 88% { opacity: 1; } 95%, 100% { opacity: 0; } }
    @keyframes s4 { 0%, 45% { opacity: 0; } 49% { opacity: 1; } 88% { opacity: 1; } 95%, 100% { opacity: 0; } }
    @keyframes s5 { 0%, 60% { opacity: 0; } 64% { opacity: 1; } 88% { opacity: 1; } 95%, 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .s1, .s2, .s3, .s4, .s5 { animation: none; } }
  </style>
  <rect width="800" height="330" fill="#fff"/>

  <rect x="70" y="20" width="160" height="40" rx="8" fill="#f4f6fa" stroke="#222939"/>
  <text x="150" y="45" text-anchor="middle" font-size="14" fill="#222939">T1 (주문 1개)</text>
  <rect x="320" y="20" width="160" height="40" rx="8" fill="#f5f7ff" stroke="#2337ff" stroke-width="2"/>
  <text x="400" y="45" text-anchor="middle" font-size="14" font-weight="700" fill="#2337ff">stock.quantity</text>
  <rect x="570" y="20" width="160" height="40" rx="8" fill="#f4f6fa" stroke="#222939"/>
  <text x="650" y="45" text-anchor="middle" font-size="14" fill="#222939">T2 (주문 1개)</text>
  <line x1="150" y1="60" x2="150" y2="280" stroke="#c9d1e0" stroke-dasharray="4 4"/>
  <line x1="400" y1="60" x2="400" y2="280" stroke="#c9d1e0" stroke-dasharray="4 4"/>
  <line x1="650" y1="60" x2="650" y2="280" stroke="#c9d1e0" stroke-dasharray="4 4"/>

  <rect x="365" y="72" width="70" height="26" rx="13" fill="#fff" stroke="#60739f"/>
  <text x="400" y="90" text-anchor="middle" font-size="13" font-weight="700" fill="#222939">10</text>

  <line x1="398" y1="120" x2="152" y2="120" stroke="#60739f" stroke-width="2" marker-end="url(#a)" class="s1"/>
  <text x="275" y="112" text-anchor="middle" font-size="12" fill="#222939" class="s1">① 조회 → 10</text>
  <line x1="402" y1="150" x2="648" y2="150" stroke="#60739f" stroke-width="2" marker-end="url(#a)" class="s2"/>
  <text x="525" y="142" text-anchor="middle" font-size="12" fill="#222939" class="s2">② 조회 → 10</text>

  <line x1="150" y1="190" x2="398" y2="190" stroke="#60739f" stroke-width="2" marker-end="url(#a)" class="s3"/>
  <text x="275" y="182" text-anchor="middle" font-size="12" fill="#222939" class="s3">③ 10 − 1 = 9 저장</text>
  <line x1="650" y1="225" x2="402" y2="225" stroke="#d23f3f" stroke-width="2" marker-end="url(#a)" class="s4"/>
  <text x="525" y="217" text-anchor="middle" font-size="12" fill="#d23f3f" class="s4">④ 10 − 1 = 9 저장 (덮어씀)</text>

  <rect x="345" y="245" width="110" height="28" rx="14" fill="#fdecec" stroke="#d23f3f" class="s5"/>
  <text x="400" y="264" text-anchor="middle" font-size="13" font-weight="700" fill="#d23f3f" class="s5">9 (기대값 8)</text>

  <text x="400" y="312" text-anchor="middle" font-size="13" font-weight="700" fill="#d23f3f" class="s5">2개 팔렸는데 재고는 1개만 줄었다</text>
</svg>
