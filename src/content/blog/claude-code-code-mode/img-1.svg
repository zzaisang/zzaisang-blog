<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif">
  <style>
    .flow { stroke-dasharray: 6 4; animation: flow 0.8s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -10; } }
    @media (prefers-reduced-motion: reduce) { .flow { animation: none; } }
  </style>
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2337ff"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="2.6" markerHeight="2.6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d23f3f"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f8a4c"/></marker>
    <marker id="ak2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3" markerHeight="3" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#60739f"/></marker>
    <marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#60739f"/></marker>
  </defs>
  <rect width="800" height="340" fill="#fff"/>
  <line x1="400" y1="20" x2="400" y2="300" stroke="#e5e9f0" stroke-width="2"/>

  <!-- left: direct tool calls -->
  <text x="200" y="30" text-anchor="middle" font-size="15" font-weight="700" fill="#222939">직접 도구 호출</text>
  <rect x="50" y="48" width="100" height="32" rx="4" fill="#f5f7ff" stroke="#2337ff"/>
  <text x="100" y="69" text-anchor="middle" font-size="13" fill="#2337ff">모델</text>
  <rect x="250" y="48" width="100" height="32" rx="4" fill="#f4f6fa" stroke="#60739f"/>
  <text x="300" y="69" text-anchor="middle" font-size="13" fill="#222939">도구</text>
  <line x1="100" y1="80" x2="100" y2="285" stroke="#e5e9f0" stroke-width="2"/>
  <line x1="300" y1="80" x2="300" y2="285" stroke="#e5e9f0" stroke-width="2"/>

  <line x1="102" y1="105" x2="296" y2="105" stroke="#2337ff" stroke-width="1.5" marker-end="url(#ab)"/>
  <text x="200" y="99" text-anchor="middle" font-size="11" fill="#2337ff">① 호출</text>
  <line x1="298" y1="130" x2="106" y2="130" stroke="#d23f3f" stroke-width="7" marker-end="url(#ar)" class="flow"/>
  <text x="200" y="150" text-anchor="middle" font-size="11" fill="#d23f3f">결과 전체를 읽음</text>

  <line x1="102" y1="175" x2="296" y2="175" stroke="#2337ff" stroke-width="1.5" marker-end="url(#ab)"/>
  <text x="200" y="169" text-anchor="middle" font-size="11" fill="#2337ff">② 호출</text>
  <line x1="298" y1="200" x2="106" y2="200" stroke="#d23f3f" stroke-width="7" marker-end="url(#ar)" class="flow"/>

  <line x1="102" y1="235" x2="296" y2="235" stroke="#2337ff" stroke-width="1.5" marker-end="url(#ab)"/>
  <text x="200" y="229" text-anchor="middle" font-size="11" fill="#2337ff">③ 호출 …</text>
  <line x1="298" y1="260" x2="106" y2="260" stroke="#d23f3f" stroke-width="7" marker-end="url(#ar)" class="flow"/>

  <!-- right: code mode -->
  <text x="600" y="30" text-anchor="middle" font-size="15" font-weight="700" fill="#222939">Code Mode</text>
  <rect x="420" y="48" width="90" height="32" rx="4" fill="#f5f7ff" stroke="#2337ff"/>
  <text x="465" y="69" text-anchor="middle" font-size="13" fill="#2337ff">모델</text>
  <rect x="560" y="48" width="100" height="32" rx="4" fill="#f5f7ff" stroke="#2337ff"/>
  <text x="610" y="69" text-anchor="middle" font-size="13" fill="#2337ff">JavaScript</text>
  <rect x="700" y="48" width="80" height="32" rx="4" fill="#f4f6fa" stroke="#60739f"/>
  <text x="740" y="69" text-anchor="middle" font-size="13" fill="#222939">도구</text>
  <line x1="465" y1="80" x2="465" y2="285" stroke="#e5e9f0" stroke-width="2"/>
  <line x1="610" y1="80" x2="610" y2="285" stroke="#e5e9f0" stroke-width="2"/>
  <line x1="740" y1="80" x2="740" y2="285" stroke="#e5e9f0" stroke-width="2"/>

  <line x1="467" y1="105" x2="606" y2="105" stroke="#2337ff" stroke-width="1.5" marker-end="url(#ab)"/>
  <text x="537" y="99" text-anchor="middle" font-size="11" fill="#2337ff">코드 한 덩어리</text>

  <line x1="612" y1="135" x2="736" y2="135" stroke="#60739f" stroke-width="1.5" marker-end="url(#ak)"/>
  <line x1="612" y1="150" x2="736" y2="150" stroke="#60739f" stroke-width="1.5" marker-end="url(#ak)"/>
  <line x1="612" y1="165" x2="736" y2="165" stroke="#60739f" stroke-width="1.5" marker-end="url(#ak)"/>
  <line x1="738" y1="190" x2="614" y2="190" stroke="#60739f" stroke-width="5" marker-end="url(#ak2)"/>
  <text x="675" y="212" text-anchor="middle" font-size="11" fill="#60739f">병렬 호출, 결과는</text>
  <text x="675" y="226" text-anchor="middle" font-size="11" fill="#60739f">코드가 거름</text>

  <line x1="608" y1="260" x2="469" y2="260" stroke="#1f8a4c" stroke-width="2" marker-end="url(#ag)" class="flow"/>
  <text x="537" y="252" text-anchor="middle" font-size="11" fill="#1f8a4c">필요한 부분만</text>

  <text x="400" y="325" text-anchor="middle" font-size="13" font-weight="700" fill="#222939">모델이 읽는 결과의 양이 줄어든다 (개념도)</text>
</svg>
